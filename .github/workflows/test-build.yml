name: Test build

on:
  pull_request:
    branches:
      - docs

jobs:
  deploy:
   name: Test
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - name: Setup node
       uses: actions/setup-node@v4
       with:
         node-version: 20.x
     - uses: pnpm/action-setup@v4
       with:
         version: 10.14.0
     - run: pnpm install
     - run: cd src/scripts && pnpm install
     - run: cd src/scripts && node runok.js docs
     - run: pnpm run build