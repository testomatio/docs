name: Test build

on:
  pull_request:
    branches:
      - docs

jobs:
  deploy:
   name: Test
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - name: Setup Bun
       uses: oven-sh/setup-bun@v2
       with:
         bun-version: 1.3.9
     - run: bun install
     - name: Setup node
       uses: actions/setup-node@v6
       with:
         node-version: 20.x
     - run: cd src/scripts && bun install
     - run: cd src/scripts && node runok.cjs docs
     - run: bun run build