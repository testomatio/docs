name: Test build

on:
  pull_request:
    branches:
      - docs

jobs:
  deploy:
   name: Test
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v5
     - name: Setup node
       uses: actions/setup-node@v6
       with:
         node-version: 22.x
     - uses: pnpm/action-setup@v4
       with:
         version: 11.7.0
     - run: pnpm install
     - run: cd src/scripts && pnpm install
     - run: cd src/scripts && node runok.cjs docs
     - run: pnpm run build