<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1004" height="488" viewBox="0 0 1004 488">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .kicker { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.20em; text-transform: uppercase; fill: #6B7280; }
      .title  { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; fill: #111827; }
      .body   { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; letter-spacing: -0.005em; fill: #4B5563; }
    </style>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <symbol id="fb-rocket" viewBox="0 0 24 24" fill="none">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m10.051 8.102-3.778.322-1.994 1.994a.94.94 0 0 0 .533 1.6l2.698.316m8.39 1.617-.322 3.78-1.994 1.994a.94.94 0 0 1-1.595-.533l-.4-2.652m8.166-11.174a1.366 1.366 0 0 0-1.12-1.12c-1.616-.279-4.906-.623-6.38.853-1.671 1.672-5.211 8.015-6.31 10.023a.932.932 0 0 0 .162 1.111l.828.835.833.832a.932.932 0 0 0 1.111.163c2.008-1.102 8.35-4.642 10.021-6.312 1.475-1.478 1.133-4.77.855-6.385Zm-2.961 3.722a1.88 1.88 0 1 1-3.76 0 1.88 1.88 0 0 1 3.76 0Z"/>
    </symbol>
    <symbol id="fb-cog" viewBox="0 0 24 24" fill="none">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13v-2a1 1 0 0 0-1-1h-.757l-.707-1.707.535-.536a1 1 0 0 0 0-1.414l-1.414-1.414a1 1 0 0 0-1.414 0l-.536.535L14 4.757V4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v.757l-1.707.707-.536-.535a1 1 0 0 0-1.414 0L4.929 6.343a1 1 0 0 0 0 1.414l.536.536L4.757 10H4a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h.757l.707 1.707-.535.536a1 1 0 0 0 0 1.414l1.414 1.414a1 1 0 0 0 1.414 0l.536-.535 1.707.707V20a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-.757l1.707-.708.536.536a1 1 0 0 0 1.414 0l1.414-1.414a1 1 0 0 0 0-1.414l-.535-.536.707-1.707H20a1 1 0 0 0 1-1Z"/>
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
    </symbol>
    <symbol id="fb-clipboard-list" viewBox="0 0 24 24" fill="none">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3m0 3h6m-3 5h3m-6 0h.01M12 16h3m-6 0h.01M10 3v4h4V3h-4Z"/>
    </symbol>
    <symbol id="fb-bars-from-left" viewBox="0 0 24 24" fill="none">
      <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h10"/>
    </symbol>
    <symbol id="fb-code" viewBox="0 0 24 24" fill="none">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m8 8-4 4 4 4m8 0 4-4-4-4m-2-3-4 14"/>
    </symbol>
  </defs>

  <!-- Card 1 -->
  <g transform="translate(24,40)">
    <rect width="300" height="184" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>
    <text class="kicker" x="24" y="42">01</text>
    <use href="#fb-rocket" x="24" y="52" width="30" height="30" color="#3B82F6"/>
    <text class="title" x="24" y="114">Tests Page</text>
    <text class="body" x="24" y="140">Quick-launch tests or suites, or add</text>
    <text class="body" x="24" y="160">them to a run already in progress.</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(352,40)">
    <rect width="300" height="184" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>
    <text class="kicker" x="24" y="42">02</text>
    <use href="#fb-cog" x="24" y="52" width="30" height="30" color="#3B82F6"/>
    <text class="title" x="24" y="114">Runs Page</text>
    <text class="body" x="24" y="140">Build fully configured runs from all</text>
    <text class="body" x="24" y="160">tests, a test plan, or a selection.</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(680,40)">
    <rect width="300" height="184" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>
    <text class="kicker" x="24" y="42">03</text>
    <use href="#fb-clipboard-list" x="24" y="52" width="30" height="30" color="#3B82F6"/>
    <text class="title" x="24" y="114">Checklist Mode</text>
    <text class="body" x="24" y="140">Hide test descriptions for fast,</text>
    <text class="body" x="24" y="160">distraction-free manual execution.</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(188,252)">
    <rect width="300" height="184" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>
    <text class="kicker" x="24" y="42">04</text>
    <use href="#fb-bars-from-left" x="24" y="52" width="30" height="30" color="#3B82F6"/>
    <text class="title" x="24" y="114">Steps Execution</text>
    <text class="body" x="24" y="140">Mark each step Passed, Failed, or</text>
    <text class="body" x="24" y="160">Skipped for detailed traceability.</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(516,252)">
    <rect width="300" height="184" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>
    <text class="kicker" x="24" y="42">05</text>
    <use href="#fb-code" x="24" y="52" width="30" height="30" color="#3B82F6"/>
    <text class="title" x="24" y="114">Automated Tests</text>
    <text class="body" x="24" y="140">Run automated tests in manual mode</text>
    <text class="body" x="24" y="160">via a plan or the Runs page toggle.</text>
  </g>
</svg>
