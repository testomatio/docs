<!-- H = 104 + 592 + 60 + 12 = 768 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 768" width="1100" height="768">
<defs>
<style>
@font-face { font-family:'THICCCBOI'; font-weight:400; src: local('THICCCBOI-Regular'), local('THICCCBOI'), url('https://cdn.jsdelivr.net/gh/wonderunit/font-thicccboi@master/fonts/Webfont/THICCCBOI-Regular.woff2') format('woff2'); }
@font-face { font-family:'THICCCBOI'; font-weight:500; src: local('THICCCBOI-Medium'), url('https://cdn.jsdelivr.net/gh/wonderunit/font-thicccboi@master/fonts/Webfont/THICCCBOI-Medium.woff2') format('woff2'); }
@font-face { font-family:'THICCCBOI'; font-weight:600; src: local('THICCCBOI-SemiBold'), url('https://cdn.jsdelivr.net/gh/wonderunit/font-thicccboi@master/fonts/Webfont/THICCCBOI-SemiBold.woff2') format('woff2'); }
text { -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
.st { font-family:'THICCCBOI',sans-serif; font-size:20px; font-weight:600; letter-spacing:-0.01em; }
.sb { font-family:'THICCCBOI',sans-serif; font-size:16px; font-weight:500; }
.sk { font-family:'THICCCBOI',sans-serif; font-size:14px; font-weight:500; letter-spacing:0.05em; }
.sn { font-family:'THICCCBOI',sans-serif; font-size:13px; font-weight:600; }
.ol { font-family:'THICCCBOI',sans-serif; font-size:18px; font-weight:600; }
</style>
<filter id="cs" x="-8%" y="-15%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/></filter>
</defs>
<rect width="1100" height="768" fill="#FAFAFA"/>
<text text-anchor="middle" x="550" y="68" style="font-family:'THICCCBOI',sans-serif;font-size:32px;font-weight:600;letter-spacing:-0.02em"><tspan fill="#6366F1">ChatGPT</tspan><tspan fill="#171717"> setup in 6 steps</tspan></text>
<g transform="translate(60, 104)"><g transform="translate(20, 0)">
<circle cx="470" cy="300" r="95" fill="none" stroke="#E5E5E5" stroke-width="1"/>
<circle cx="470" cy="300" r="145" fill="none" stroke="#E5E5E5" stroke-width="1"/>
<circle cx="470" cy="300" r="210" fill="none" stroke="#D4D4D4" stroke-width="1.5"/>
<rect x="420" y="250" width="100" height="100" rx="24" style="fill:#EEF2FF;stroke:#A5B4FC;stroke-width:1" filter="url(#cs)"/>
<svg x="442" y="272" width="56" height="56" viewBox="0 0 116 116" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M40.5147 15.2354H10.6475V39.2883H45.4926V111.447H70.382V44.0989V15.2354H40.5147Z" fill="#252525"/><path d="M85.3151 15.2354H75.3594V63.3412H85.3151V15.2354Z" fill="#5C89FC"/><path d="M100.25 15.2354H90.2939V44.0989H100.25V15.2354Z" fill="#252525"/></svg>
<!-- top: 1. Copy the Link -->
